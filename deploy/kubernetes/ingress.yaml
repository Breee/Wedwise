apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wedwise
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
  - host: wedding.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wedwise
            port:
              number: 80
  tls:
  - hosts:
    - wedding.example.com
    secretName: wedwise-tls
