# Wedwise Configuration Example
# Copy to /config/config.yaml and customize

listenAddress: ":8080"
databasePath: "/data/wedding.db"
baseUrl: "https://wedding.example.com"
configPath: "/config/config.yaml"
# Optional: a custom theme YAML (same schema as themes/*.yaml) that is added to
# the bundled themes and selectable in the content editor. Env: THEME_PATH
# themePath: "/config/theme.yaml"
# Set to true only when a reverse proxy in front of Wedwise sets X-Forwarded-For;
# used for rate limiting by client IP. Env: TRUST_PROXY_HEADERS=true
trustProxyHeaders: false

# Optional login hardening.
# auth:
#   requireTwoFactor: [admin, witness]
#   sessionMaxAge: 24h
#   sessionIdleTimeout: 2h
# Optional OpenRouteService key for live walking/bike/car routes.
# routingApiKey: ""

event:
  # Optional, shown with their defaults:
  # language: de                     # UI language: de or en
  # timezone: Europe/Berlin          # used for the calendar entry
  # contributionMinutes: 15          # time limit suggested for guest contributions
  # musicGenres: [Pop, Rock, Hip-Hop, Schlager, 80er, 90er, 2000er, House / Electro, Latin, Soul / Funk, Indie]
  title: "Alex & Sam's Wedding"
  couple:
    - name: "Alex"
    - name: "Sam"
  date: "2027-06-25"
  venue:
    name: "Example Garden Venue"
    address: "123 Garden Lane, Exampletown"
    description: "A beautiful garden venue in the heart of Exampletown."
    navigationUrl: "https://maps.example.com/example-venue"
    transport: "Take bus line 42 to Garden Stop."
    parking: "Free parking available on site."
  hero:
    eyebrow: "SAVE THE DATE"
    headline: "We're Getting Married!"
    subtitle: "Ceremony & Celebration"
    note: "We can't wait to celebrate with you."
