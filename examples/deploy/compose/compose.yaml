# Production example: published image behind Traefik with automatic HTTPS.
# 1. cp .env.example .env   and fill in DOMAIN, ACME_EMAIL, SESSION_SECRET and DATA_KEY
# 2. put config.yaml (see ../../config.yaml) into ./config/
# 3. docker compose up -d
# 4. docker compose exec wedwise /app/wedding user create --username admin --role admin
services:
  wedwise:
    # For a fixed build, pin a digest: ghcr.io/breee/wedwise@sha256:...
    image: ghcr.io/breee/wedwise:${WEDWISE_VERSION:-latest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      BASE_URL: "https://${DOMAIN:?set DOMAIN in .env}"
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env}"
      DATA_KEY: "${DATA_KEY:?set DATA_KEY in .env}"
      DATA_KEY_PREVIOUS: "${DATA_KEY_PREVIOUS:-}"
      ENVIRONMENT: production
      TRUST_PROXY_HEADERS: "true"
      DATABASE_PATH: /data/wedding.db
      CONFIG_PATH: /config/config.yaml
      ROUTING_API_KEY: "${ROUTING_API_KEY:-}"
    volumes:
      - wedwise-data:/data
      - ./config:/config:ro

  traefik:
    image: traefik:v3.7@sha256:a6c0194dda77bcb804824580f36fa7edc56e315b1acfe933366c8b52844a78a4
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./traefik.yaml:/etc/traefik/dynamic.yaml:ro
      - traefik-acme:/acme
    depends_on:
      - wedwise

volumes:
  wedwise-data:
  traefik-acme:
