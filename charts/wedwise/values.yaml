image:
  repository: ghcr.io/breee/wedwise
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Public address guests open. Logins from any other origin are rejected.
baseUrl: "http://localhost:8080"

# Event configuration, rendered to /config/config.yaml. See examples/config.yaml.
config:
  title: "Our Wedding"

# Page content (schedule, location, travel, accommodation, FAQ, theme name),
# same shape as examples/content.json. Applied at startup whenever it changes;
# edits made in the editor are kept until then. Leave empty to manage content
# in the editor only.
content: {}

# Optional custom theme, same shape as the files in themes/.
theme: {}

# Users created at startup. Stored in the chart Secret (key users.yaml); with
# secret.existingSecret, put a users.yaml key into that Secret instead.
# Passwords need at least 10 characters. Changing a password here updates it.
users: []
  # - username: anna
  #   role: couple          # couple | witness | admin
  #   password: change-me-please
  #   displayName: Anna

# Images served under /images/<name>, e.g. for location.image or hero.image.
# Values are base64, e.g. --set images.files.lake\\.jpg="$(base64 -w0 lake.jpg)".
# All images together must stay below ~1 MiB; for more, use images.existingConfigMap.
images:
  files: {}
  existingConfigMap: ""

# Secret holding the keys below. Created by the chart when existingSecret is empty.
secret:
  existingSecret: ""
  # Required when existingSecret is empty. At least 16 characters.
  sessionSecret: ""
  # Optional OpenRouteService key for walking, cycling and driving routes.
  routingApiKey: ""

# Extra environment variables, e.g. TRUST_PROXY_HEADERS behind an ingress.
env: []
#  - name: TRUST_PROXY_HEADERS
#    value: "true"

# SQLite lives on this volume. The app runs as a single replica.
persistence:
  enabled: true
  existingClaim: ""
  size: 1Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: wedding.example.com
  tls: []

resources: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
