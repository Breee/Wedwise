{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wedwise.fullname" . }}
  labels: {{- include "wedwise.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-secret: {{ required "secret.sessionSecret or secret.existingSecret is required" .Values.secret.sessionSecret | quote }}
  routing-api-key: {{ .Values.secret.routingApiKey | quote }}
  users.yaml: {{ toYaml .Values.users | quote }}
{{- end }}
