apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wedwise.fullname" . }}
  labels: {{- include "wedwise.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
  {{- with .Values.content }}
  content.json: {{ toJson . | quote }}
  {{- end }}
  {{- with .Values.theme }}
  theme.yaml: |
    {{- toYaml . | nindent 4 }}
  {{- end }}
