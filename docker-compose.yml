services:
  wedwise:
    build: .
    image: wedwise:local
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDRESS: ":8080"
      DATABASE_PATH: "/data/wedding.db"
      CONFIG_PATH: "/config/config.yaml"
      BASE_URL: "${BASE_URL:-http://localhost:8080}"
      ENVIRONMENT: "development"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      SESSION_SECRET: "${SESSION_SECRET:-local-dev-secret-change-me-32-bytes!!}"
      DATA_KEY: "${DATA_KEY:-local-dev-data-key-change-me-32-bytes}"
      DATA_KEY_PREVIOUS: "${DATA_KEY_PREVIOUS:-}"
      REQUIRE_TWO_FACTOR: "${REQUIRE_TWO_FACTOR:-}"
      IMAGE_HOSTS: "${IMAGE_HOSTS:-}"
      ROUTING_API_KEY: "${ROUTING_API_KEY:-}"
    volumes:
      - wedwise-data:/data
      - ./local:/config:ro

  # Local HTTPS for testing on phones: `make https`
  traefik:
    image: traefik:v3.7@sha256:a6c0194dda77bcb804824580f36fa7edc56e315b1acfe933366c8b52844a78a4
    profiles: [https]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./examples/local-https/traefik.yaml:/etc/traefik/dynamic.yaml:ro
      - ./local/certs:/certs:ro

volumes:
  wedwise-data:
