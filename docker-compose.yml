services:
  wedwise:
    build: .
    image: wedwise:local
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDRESS: ":8080"
      DATABASE_PATH: "/data/wedding.db"
      CONFIG_PATH: "/config/config.yaml"
      BASE_URL: "${BASE_URL:-http://localhost:8080}"
      ENVIRONMENT: "development"
      SESSION_SECRET: "${SESSION_SECRET:-local-dev-secret-change-me-32-bytes!!}"
      DATA_KEY: "${DATA_KEY:-local-dev-data-key-change-me-32-bytes}"
      DATA_KEY_PREVIOUS: "${DATA_KEY_PREVIOUS:-}"
      REQUIRE_TWO_FACTOR: "${REQUIRE_TWO_FACTOR:-}"
      IMAGE_HOSTS: "${IMAGE_HOSTS:-}"
      ROUTING_API_KEY: "${ROUTING_API_KEY:-}"
    volumes:
      - wedwise-data:/data
      - ./local:/config:ro

volumes:
  wedwise-data:
